[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pyippdme"
dynamic = ["version"]
description = "Client and server package for the I++ DME dimensional measurement equipment protocol (VDMA 8722)"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Thomas Ascher", email = "thomas.ascher@gmx.at" }]
keywords = ["i++dme", "vdma8722", "cmm", "metrology", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking",
]
dependencies = ["lark>=1.1", "numpy>=1.26", "defusedxml>=0.7"]

[project.optional-dependencies]
tui = ["textual>=0.80", "textual-autocomplete>=4.0"]

[project.urls]
Homepage = "https://github.com/aschet/pyippdme"
Documentation = "https://aschet.github.io/pyippdme/"
Issues = "https://github.com/aschet/pyippdme/issues"
Changelog = "https://github.com/aschet/pyippdme/releases"

[project.scripts]
ippdme = "pyippdme.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "types-defusedxml>=0.7",
  "ruff>=0.6",
  "vulture>=2.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "check-manifest>=0.49",
  "validate-pyproject>=0.19",
  "pre-commit>=3.8",
  "reuse>=5.0",
  "textual>=0.80",
  "textual-autocomplete>=4.0",
]
docs = ["sphinx>=8.0", "furo>=2024.8.6", "myst-parser>=4.0"]

[tool.hatch.version]
path = "src/pyippdme/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyippdme"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D", "PT", "ERA", "S"]
# Docstrings are required at module/class level (self-documenting API surface);
# requiring one on every method/function/magic-method/`__init__` would force
# noise onto trivial accessors like `to_wire()` on every AST node.
ignore = ["D102", "D103", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "S101", "S104"]
"src/pyippdme/cli/*" = ["S603", "S607"]
# Narrows Lark's dynamically-typed parse tree back to our AST types; these are
# internal invariant checks on our own transformer's output, not a security
# boundary on untrusted input.
"src/pyippdme/protocol/parser.py" = ["S101"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pyippdme"]

[tool.coverage.report]
fail_under = 75

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.bandit]
exclude_dirs = ["tests"]
# B101 (assert): bandit has no per-file config, only a project-wide skip list.
# Every current use of assert in src/ (all in protocol/parser.py) narrows
# Lark's dynamically-typed parse tree back to our AST types after our own
# transformer runs - an internal invariant check, not validation of
# untrusted input (see the matching ruff per-file-ignore).
skips = ["B101"]
